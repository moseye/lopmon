services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lopmon
      POSTGRES_PASSWORD: lopmon
      POSTGRES_DB: lopmon
    volumes:
      # postgres:18+ stores data in a version-specific subdir; mount the parent.
      - lopmon-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lopmon -d lopmon"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  bot:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Overrides any DATABASE_URL in .env with the in-network host.
      DATABASE_URL: postgres://lopmon:lopmon@postgres:5432/lopmon
    depends_on:
      postgres:
        condition: service_healthy
    # Apply migrations, then start the gateway bot.
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/index.js"]

volumes:
  lopmon-pg:
